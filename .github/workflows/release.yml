name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # Enables the manual trigger button
    inputs:
      release_version:
        description: 'Version to embed in the binaries'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  webui:
    name: Build Web UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        working-directory: webui
        run: npm ci

      - name: Build Web UI
        working-directory: webui
        run: npm run build

      - name: Upload Web UI
        uses: actions/upload-artifact@v4
        with:
          name: webui
          path: build/webui
          if-no-files-found: error

  musl:
    name: Build Linux musl
    needs: [test, webui]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.release_version || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Web UI
        uses: actions/download-artifact@v4
        with:
          name: webui
          path: webui

      - name: Build Linux musl binary
        run: |
          docker run --rm \
            --env VERSION="$VERSION" \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            golang:1.26-alpine \
            sh -c 'apk add --no-cache build-base && CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o picup-linux-musl-amd64 ./core'

      - name: Package Linux musl release
        run: |
          mkdir -p release/picup-linux-musl-amd64
          cp picup-linux-musl-amd64 release/picup-linux-musl-amd64/
          cp core/example.config.ini release/picup-linux-musl-amd64/config.ini
          cp -R webui release/picup-linux-musl-amd64/webui
          tar -C release -czf picup-linux-musl-amd64.tar.gz picup-linux-musl-amd64

      - name: Upload Linux musl release
        uses: actions/upload-artifact@v4
        with:
          name: picup-linux-musl-amd64
          path: picup-linux-musl-amd64.tar.gz
          if-no-files-found: error

  glibc:
    name: Build Linux glibc
    needs: [test, webui]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.release_version || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Web UI
        uses: actions/download-artifact@v4
        with:
          name: webui
          path: webui

      - name: Build Linux glibc binary
        run: |
          docker run --rm \
            --env VERSION="$VERSION" \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -c 'pacman -Sy --noconfirm --needed base-devel go && CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o picup-linux-glibc-amd64 ./core'

      - name: Package Linux glibc release
        run: |
          mkdir -p release/picup-linux-glibc-amd64
          cp picup-linux-glibc-amd64 release/picup-linux-glibc-amd64/
          cp core/example.config.ini release/picup-linux-glibc-amd64/config.ini
          cp -R webui release/picup-linux-glibc-amd64/webui
          tar -C release -czf picup-linux-glibc-amd64.tar.gz picup-linux-glibc-amd64

      - name: Upload Linux glibc release
        uses: actions/upload-artifact@v4
        with:
          name: picup-linux-glibc-amd64
          path: picup-linux-glibc-amd64.tar.gz
          if-no-files-found: error

  windows:
    name: Build Windows
    needs: [test, webui]
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.release_version || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW to PATH
        shell: pwsh
        run: echo "C:\\msys64\\mingw64\\bin" >> $env:GITHUB_PATH

      - name: Download Web UI
        uses: actions/download-artifact@v4
        with:
          name: webui
          path: webui

      - name: Build Windows binary
        shell: pwsh
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
          CC: gcc
        run: go build -trimpath -ldflags="-s -w -X main.version=$env:VERSION" -o picup-windows-amd64.exe ./core

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/picup-windows-amd64 | Out-Null
          Copy-Item picup-windows-amd64.exe release/picup-windows-amd64/
          Copy-Item core/example.config.ini release/picup-windows-amd64/config.ini
          Copy-Item -Recurse webui release/picup-windows-amd64/webui
          Compress-Archive -Path release/picup-windows-amd64 -DestinationPath picup-windows-amd64.zip

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: picup-windows-amd64
          path: picup-windows-amd64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [musl, glibc, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux musl release
        uses: actions/download-artifact@v4
        with:
          name: picup-linux-musl-amd64
          path: dist

      - name: Download Linux glibc release
        uses: actions/download-artifact@v4
        with:
          name: picup-linux-glibc-amd64
          path: dist

      - name: Download Windows release
        uses: actions/download-artifact@v4
        with:
          name: picup-windows-amd64
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
